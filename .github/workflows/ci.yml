name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install the toolchain from mise.toml (pins node + bun); no version is
      # hardcoded here — mise.toml is the single source of truth.
      - uses: jdx/mise-action@v4

      - run: bun install --frozen-lockfile

      # The native read-only gate resolves the repository's declared skills from the
      # verified active harness collection and runs their registered operations.
      - name: Audit
        run: ki repo audit

      # The harness self-test suite (rubric, payload, and hook tests).
      - name: Test
        run: bun run test
