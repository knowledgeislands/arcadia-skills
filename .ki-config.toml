"https://github.com/knowledgeislands/mcp-gsuite" = "maintainer"
"https://github.com/knowledgeislands/mcp-ki-kb-fs" = "maintainer"
"https://github.com/knowledgeislands/mcp-ki-kb-notion-mirror" = "maintainer"
