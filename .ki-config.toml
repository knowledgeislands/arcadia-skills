[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/knowledgeislands/ki-agentic-harness"
title = "ki-agentic-harness"
description = "Knowledge Islands agentic harness — canonical home for Agent Skills, Agents, MCP servers, and Evals across the Knowledge Islands ecosystem."
repo_code = "KI-HARNESS"
visibility = "public"
license = "MIT"
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]

[skills.ki-repo.checks]
coverage-checkpoint = false # source repository publishes the optional capability without adopting a checkpoint subarea

[skills.ki-authoring]

[skills.ki-engineering]

[skills.ki-binding]

[skills.ki-binding-claude]

[skills.ki-repo-project]

[skills.ki-repo-harness]

[skills.ki-skills]

[skills.ki-subagents]

[skills.ki-decision-records]

[skills.ki-delegation]

[skills.ki-specs]

[skills.ki-guides]

[skills.ki-trades]

[skills.ki-agora]

[skills.ki-trades.routes."knowledgeislands/ki-website"]
export = ["work", "knowledge"]

[skills.ki-trades.routes."knowledgeislands/tools-ki"]
export = ["work"]
import = ["work", "knowledge"]

[skills.ki-trades.routes."knowledgeislands/tools-mgit"]
export = ["work", "knowledge"]
import = ["work", "knowledge"]

[skills.ki-trades.routes."krisb/dotfiles"]
export = ["work"]

[skills.ki-git]

[skills.ki-housekeeping-claude]

[skills.ki-change-management-housekeeping]

[skills.ki-change-management]
adapter = "roadmap"

[skills.ki-change-management-roadmap]

[skills.ki-change-management-roadmap.areas]
FND = "foundation-tooling"
GOV = "governance-consistency"
OPS = "operations"
RTP = "runtime-portability"

[skills.ki-checkpoint]

[skills.ki-tokenomics]
headroom = "recommended"
# Cross-skill governance benefits from the higher-reasoning project default.
preferred_model_type = "reasoning"

[skills.ki-tokenomics.budgets]
mcp_servers = 20 # User-scoped; revisit if the global MCP set is pruned.

[skills.ki-tokenomics-claude]

[skills.ki-tokenomics-codex]

[skills.ki-agora.homes.ki-all]
owner = "https://github.com/knowledgeislands/ki-agentic-harness"
purpose = "Knowledge Islands ecosystem repositories"

[skills.ki-agora.homes.ki-all.members]
"https://github.com/krisb/dotfiles" = "maintainer"
"https://github.com/knowledgeislands/homebrew-tap" = "maintainer"
"https://github.com/knowledgeislands/ki-arcadia-principal" = "maintainer"
